<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D247BF" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#090d16" stroke="url(#lmGradient)" stroke-width="4" filter="url(#glow)"/>

  <!-- Geometric LM Tech Icon -->
  <path d="M 26 70 V 30 L 40 50 L 54 30 V 70" stroke="url(#lmGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 58 30 H 78 M 68 30 V 70" stroke="url(#lmGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tech Glowing Nodes -->
  <circle cx="26" cy="30" r="3.5" fill="#D247BF"/>
  <circle cx="78" cy="30" r="3.5" fill="#38bdf8"/>
  <circle cx="68" cy="70" r="3.5" fill="#6366f1"/>
</svg>
